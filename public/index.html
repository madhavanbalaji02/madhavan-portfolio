       Old browsers (KaiOS feature phones, Opera Mini, very old Safari/Firefox) keep the
       prerendered static page fully visible, with JS-only controls hidden.
       ES5 on purpose so it runs everywhere. -->
  <script>
    (function (w, d) {
      var ok = 'IntersectionObserver' in w && 'Promise' in w && 'fetch' in w &&
               !!(w.CSS && w.CSS.supports && w.CSS.supports('display', 'grid')) &&
               typeof Object.assign === 'function' && !!Array.prototype.includes;
      if (ok) d.documentElement.className += ' js';
    })(window, document);
  </script>

  <!-- Light is the default theme. Apply a visitor's saved choice before first paint so
       anyone who picked dark never sees a flash of light (App.js keeps it in sync). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1519');
      } catch (e) {}
    })();
  </script>
